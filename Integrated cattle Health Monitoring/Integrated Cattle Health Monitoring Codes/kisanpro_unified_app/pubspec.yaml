name: kisanpro_unified_app
description: "Unified AI Cattle Health, Milk, Weight, and Vaccination Monitoring Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  http: ^1.2.1
  fl_chart: ^0.68.0
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  pdf: 3.11.1
  printing: 5.13.1
  path_provider: ^2.1.3
  share_plus: 7.2.1
  intl: ^0.19.0
  model_viewer_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/measurement_guide.png
    - assets/guide_front.png
    - assets/guide_back.png
    - assets/guide_left.png
    - assets/guide_right.png
    - assets/models/seethamma_model.glb
    - assets/models/ramana_model.glb
